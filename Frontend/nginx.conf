server {
    listen 5000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # API
    # ------------------------------------------------------------------
    # Sem proxy_pass com barra final: a URI original e repassada intacta,
    # que e o que os controllers esperam (rotas api/users, api/rooms...).
    #
    # TODO(B2): remover os dois desvios abaixo e mandar tudo ao Gateway.
    # O Gateway aplica FallbackPolicy=RequireAuthenticatedUser tambem nas
    # rotas do YARP, entao /api/auth/login e POST /api/users exigiriam um
    # token que quem ainda nao autenticou nao tem.
    # Ver docs/sdd/backlog.md#b2
    location /api/auth/ {
        proxy_pass http://authservice:5000;
        include /etc/nginx/proxy-app.conf;
    }

    location /api/users {
        proxy_pass http://userservice:5000;
        include /etc/nginx/proxy-app.conf;
    }

    location /api/ {
        proxy_pass http://gateway:5000;
        include /etc/nginx/proxy-app.conf;
    }

    # ------------------------------------------------------------------
    # SPA
    # ------------------------------------------------------------------
    # Rota do cliente (ex.: /login) nao existe como arquivo: cai no index
    # para o React Router resolver.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados agressivamente;
    # o index.html nunca, senao o deploy novo nao chega ao navegador.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
